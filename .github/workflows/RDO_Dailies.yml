name: RDO Dailies v5

on:
  schedule:
    - cron: '10 7 * * *'  # Runs at 07:10 UTC every day
  
  workflow_dispatch:  # Enables the manual "Run workflow" button

# This permission block is required for the action to push changes back to the repo
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run script to generate index.html
      run: |
        # Make sure RDO_dailies_v5.py is in your repository!
        python RDO_dailies_v5.py

    - name: Commit and push generated files
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # Stage index.html and jsonFiles (or everything with git add -A)
        git add index.html jsonFiles/ || git add -A

        # Only proceed if there are actual staged changes
        if ! git diff --staged --quiet; then
          git commit -m "Auto-update RDO Dailies v5"
          # Pull any remote changes first to prevent push rejection
          git pull --rebase origin main
          git push origin HEAD:main
        else
          echo "No changes to commit. Skipping push."
        fi
